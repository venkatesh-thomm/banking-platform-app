
name: Banking Backend CI/CD

on:
  push:
    branches:
      - dev

  pull_request:
    branches:
      - dev

  workflow_dispatch:
    inputs:
      environment:
        description: "Select deployment environment"
        required: true
        type: choice
        options:
          - dev
          - qa
          - prod

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:

  # --------------------------------------------------
  # TEST
  # --------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: app/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: app/backend
        run: |
          python -m pytest


  # --------------------------------------------------
  # SECURITY
  # --------------------------------------------------
  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 1


  # --------------------------------------------------
  # BUILD & PUSH
  # --------------------------------------------------
  build:
    name: Build and Push Image
    needs:
      - test
      - security

    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/dev')

    runs-on: ubuntu-latest

    environment:
      name: ${{ github.event.inputs.environment || 'qa' }}

    env:
      DEPLOY_ENV: ${{ github.event.inputs.environment || 'qa' }}
      ECR_REPOSITORY: banking-${{ github.event.inputs.environment || 'qa' }}-backend
      GITOPS_VALUES_FILE: values-${{ github.event.inputs.environment || 'qa' }}.yaml

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      # ------------------------------------------------
      # AWS AUTHENTICATION
      # ------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}


      # ------------------------------------------------
      # ECR LOGIN
      # ------------------------------------------------
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # ------------------------------------------------
      # DOCKER BUILD
      # ------------------------------------------------
      - name: Build Docker image
        working-directory: app/backend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            .


      # ------------------------------------------------
      # DOCKER SECURITY SCAN
      # ------------------------------------------------
      - name: Scan Docker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1


      # ------------------------------------------------
      # PUSH IMAGE
      # ------------------------------------------------
      - name: Push image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG


      # ------------------------------------------------
      # UPDATE GITOPS
      # ------------------------------------------------
      - name: Update GitOps image tag
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_REPO_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
        run: |

          git clone \
            https://x-access-token:${GITOPS_TOKEN}@github.com/venkatesh-thomm/banking-platform-devops.git \
            gitops

          cd gitops

          git checkout dev

          sed -i \
            "s/^  tag: .*/  tag: \"${IMAGE_TAG}\"/" \
            helm/banking-backend/${GITOPS_VALUES_FILE}

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add helm/banking-backend/${GITOPS_VALUES_FILE}
          
          if git diff --cached --quiet; then
            echo "Image tag is already up to date."
          else
            git commit \
               -m "Update ${DEPLOY_ENV} banking backend image to ${IMAGE_TAG}"

            git push origin dev
          fi   
