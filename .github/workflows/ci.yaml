
name: Banking Backend CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      environment:
        description: "Select deployment environment"
        required: true
        type: choice
        options:
          - main
          

permissions:
  id-token: write
  contents: read
  security-events: write

env:
  AWS_REGION: us-east-1

jobs:

  # --------------------------------------------------
  # TEST
  # --------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Python Dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-python-3.12-${{ hashFiles('app/backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-python-3.12-  

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: app/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: app/backend
        run: |
          python -m pytest


  # --------------------------------------------------
  # SECURITY
  # --------------------------------------------------
  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 1


  # --------------------------------------------------
  # BUILD & PUSH
  # --------------------------------------------------
  build:
    name: Build and Push Image
    needs:
      - test
      - security

    if: |
      github.ref == 'refs/heads/main' &&
      (
       github.event_name == 'workflow_dispatch' ||
       github.event_name == 'push'
      )

    runs-on: ubuntu-latest


    env:
      DEPLOY_ENV: main
      ECR_REPOSITORY: banking-backend
      GITOPS_VALUES_FILE: values.yaml

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug OIDC Token
        run: |
          TOKEN=$(curl -sS --fail \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["value"])')
          PAYLOAD=$(printf '%s' "$TOKEN" | cut -d'.' -f2)
          PAYLOAD_LENGTH=$((${#PAYLOAD} % 4))
          if [ "$PAYLOAD_LENGTH" -eq 2 ]; then PAYLOAD="${PAYLOAD}=="; fi
          if [ "$PAYLOAD_LENGTH" -eq 3 ]; then PAYLOAD="${PAYLOAD}="; fi
          printf '%s' "$PAYLOAD" | tr '_-' '/+' | base64 -d 2>/dev/null \
            | python3 -c 'import json, sys; claims=json.load(sys.stdin); print(json.dumps({k: claims.get(k) for k in ("aud","sub","iss","repository","ref")}, indent=2))'

      # ------------------------------------------------
      # AWS AUTHENTICATION
      # ------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::210006515453:role/github_oidc
          role-session-name: GitHubActions


      # ------------------------------------------------
      # ECR LOGIN
      # ------------------------------------------------
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # ------------------------------------------------
      # DOCKER BUILD
      # ------------------------------------------------
      - name: Build Docker image
        working-directory: app/backend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            .


      # ------------------------------------------------
      # DOCKER SECURITY SCAN
      # ------------------------------------------------
      - name: Scan Docker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1


      # ------------------------------------------------
      # PUSH IMAGE
      # ------------------------------------------------
      - name: Push image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG


      # ------------------------------------------------
      # UPDATE GITOPS
      # ------------------------------------------------
      - name: Update GitOps image tag
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_REPO_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
        run: |

          git clone \
            https://x-access-token:${GITOPS_TOKEN}@github.com/venkatesh-thomm/banking-platform-devops.git \
            gitops

          cd gitops

          git checkout dev

          sed -i \
            "s/^  tag: .*/  tag: \"${IMAGE_TAG}\"/" \
            helm/banking-backend/${GITOPS_VALUES_FILE}

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add helm/banking-backend/${GITOPS_VALUES_FILE}
          
          if git diff --cached --quiet; then
            echo "Image tag is already up to date."
          else
            git commit \
               -m "Update ${DEPLOY_ENV} banking backend image to ${IMAGE_TAG}"

            git push origin dev
          fi   
